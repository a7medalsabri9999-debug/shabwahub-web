<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>الإعدادات | شبوة HUB</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-container sub-page">
  <header class="sub-page-header">
    <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-right"></i></button>
    <h1>⚙️ الإعدادات</h1>
    <div class="header-spacer"></div>
  </header>
  <main class="page-content" style="padding:15px">
    
    <!-- الملف الشخصي -->
    <div class="card">
      <h3 style="margin-bottom:15px;border-bottom:1px solid var(--border-color);padding-bottom:10px">👤 بيانات الملف</h3>
      <div class="form-group"><label>الاسم الكامل</label><input type="text" id="set-name" class="comment-input"></div>
      <div class="form-group"><label>اسم المستخدم (@)</label><input type="text" id="set-username" class="comment-input" readonly></div>
      <div class="form-group"><label>نبذة تعريفية</label><textarea id="set-bio" class="comment-input" rows="3" maxlength="200"></textarea></div>
      <button class="btn btn-gold" style="width:100%" onclick="saveProfileSettings()">حفظ التعديلات</button>
    </div>

    <!-- الحساب والأمان -->
    <div class="card">
      <h3 style="margin-bottom:15px;border-bottom:1px solid var(--border-color);padding-bottom:10px">🔐 الحساب والأمان</h3>
      <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="set-email" class="comment-input" readonly></div>
      <div class="form-group"><label>تغيير كلمة المرور</label><input type="password" id="set-password" class="comment-input" placeholder="••••••••"></div>
      <button class="btn btn-secondary" style="width:100%" onclick="updatePassword()">تحديث كلمة المرور</button>
    </div>

    <!-- التفضيلات -->
    <div class="card">
      <h3 style="margin-bottom:15px;border-bottom:1px solid var(--border-color);padding-bottom:10px">🎨 التفضيلات</h3>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0">
        <span>الوضع الداكن</span>
        <label class="switch"><input type="checkbox" id="theme-toggle" checked><span class="slider"></span></label>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0">
        <span>إشعارات الصوت</span>
        <label class="switch"><input type="checkbox" id="sound-toggle" checked><span class="slider"></span></label>
      </div>
    </div>

    <!-- منطقة الخطر -->
    <div class="card" style="border-color:var(--error)">
      <h3 style="margin-bottom:15px;color:var(--error)">⚠️ منطقة الخطر</h3>
      <button class="btn btn-danger" style="width:100%;margin-bottom:10px" onclick="signOutUser()">تسجيل الخروج</button>
      <button class="btn btn-secondary" style="width:100%;color:var(--error);border-color:var(--error)" onclick="deleteAccount()">حذف الحساب نهائياً</button>
    </div>

  </main>

  <style>
    .switch{position:relative;display:inline-block;width:50px;height:26px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#4b5563;transition:.3s;border-radius:26px}.slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%}input:checked+.slider{background:var(--gold-primary)}input:checked+.slider:before{transform:translateX(24px)}
  </style>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module">
    import { getCurrentUser } from './js/app.js';
    import { signOutUser } from './js/auth.js';
    import { toggleTheme } from './js/theme.js';
    window.signOutUser = signOutUser;
    document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
    document.addEventListener('DOMContentLoaded', () => {
      const user = getCurrentUser();
      if(!user) window.location.href = 'index.html';
      // تعبئة الحقول مؤقتاً (سيتم ربطها بـ DB لاحقاً)
      document.getElementById('set-name').value = user.displayName || '';
      document.getElementById('set-username').value = user.email.split('@')[0];
      document.getElementById('set-email').value = user.email;
    });
  </script>
</body>
</html>
