<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | شبوة HUB</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <img src="img/logo.png" alt="شبوة HUB" class="auth-logo">
    <h1 class="username gold-text">شبوة <span class="gold-text">HUB</span></h1>
    <p class="auth-welcome">نتشرف بكل العرب 🌟</p>
    
    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="login-password" required>
      </div>
      <label class="checkbox-label">
        <input type="checkbox" id="remember-me">
        <span>تذكرني</span>
      </label>
      <button type="submit" class="btn btn-primary btn-block">تسجيل الدخول</button>
    </form>
    
    <p class="auth-switch">
      ليس لديك حساب؟ <a href="signup.html">إنشاء حساب جديد</a>
    </p>
  </div>
  
  <script type="module">
    import { initAuth } from './js/auth.js';
    initAuth();
  </script>
</body>
</html>
